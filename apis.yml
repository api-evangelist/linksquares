    type: Documentation
  description: >-
    User and group lifecycle management is offered through SCIM 2.0 provisioning on the Enterprise tier
    rather than a public REST endpoint. There is no documented public REST user-management API, base path,
    or published SCIM auth flow; the SCIM endpoint URL and supported operations are provided during a
    vendor onboarding call. This entry is an honest gated stub - no endpoints are modeled because none
    are publicly confirmable. The GET /api/analyze/v1/me endpoint on the Analyze API returns the identity
    of the user the API key is assigned to.
