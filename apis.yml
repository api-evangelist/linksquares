name: LinkSquares
kind: company
description: >-
  LinkSquares is an AI-powered contract lifecycle management (CLM) platform that
  helps legal teams draft, review, execute, and analyze agreements. Its public
  REST API is split across two products - Analyze, which surfaces processed
  agreements plus the metadata, Smart Values, terms, types, tags, and
  parent/child hierarchy extracted from them, and lets you import DOCX/PDF
  documents for AI processing; and Finalize, which lets external systems retrieve
  templates, create draft/intake/request agreements, and retrieve and approve
  tasks so stakeholders can collaborate on contracts without leaving their own
  tools. A single API token is shared across Analyze and Finalize and is passed
  as an x-api-key header. API access is gated to LinkSquares customers, and keys
  are self-managed by Administrator users; user and group provisioning is offered
  through SCIM 2.0 on the Enterprise tier rather than a public REST endpoint.
