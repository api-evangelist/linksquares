apis:
- aid: linksquares:linksquares-analyze-agreements-api
  name: LinkSquares Analyze Agreements API
  tags:
  - Agreements
  - Contracts
  - Documents
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://help.linksquares.com/hc/en-us/articles/10575707057175-LinkSquares-API-Overview
  baseURL: https://api.linksquares.com/api/analyze
  properties:
  - url: https://help.linksquares.com/hc/en-us/articles/10575707057175-LinkSquares-API-Overview
    type: Documentation
  - url: https://help.linksquares.com/hc/en-us/articles/10849398433559-Analyze-API-Sample-Use-Cases
    type: APIReference
  - url: openapi/linksquares-openapi.yml
    type: OpenAPI
  - url: collections/linksquares.postman_collection.json
    type: PostmanCollection
  - url: collections/linksquares.opencollection.json
    type: OpenCollection
  description: >-
    List and retrieve processed Analyze agreements, import DOCX/PDF documents
    into LinkSquares Analyze for AI processing (a two-step create-metadata then
    PUT-to-presigned-URL upload flow), check upload status, add and download
    additional attachments, and update agreement fields. Confirmed endpoints
    include GET /v1/me, GET /v1/agreements, GET /v1/agreements/{agreement_id},
    POST /v1/agreements, PATCH /v2/agreements/{agreement_id}, POST
    /v1/agreements/{agreement_id}/attachments, GET
    /v2/agreements/{agreement_id}/attachments, GET
    /v2/agreements/{agreement_id}/attachments/{attachment_id}/download, and GET
    /v1/uploads/{upload_id}.
- aid: linksquares:linksquares-analyze-metadata-api
  name: LinkSquares Analyze Metadata and Smart Values API
  tags:
  - Metadata
  - Smart Values
  - Contract Analytics
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://help.linksquares.com/hc/en-us/articles/10575707057175-LinkSquares-API-Overview
  baseURL: https://api.linksquares.com/api/analyze
  properties:
  - url: https://help.linksquares.com/hc/en-us/articles/10575707057175-LinkSquares-API-Overview
    type: Documentation
  - url: https://help.linksquares.com/hc/en-us/articles/10849398433559-Analyze-API-Sample-Use-Cases
    type: APIReference
  - url: openapi/linksquares-openapi.yml
    type: OpenAPI
  - url: collections/linksquares.postman_collection.json
    type: PostmanCollection
  - url: collections/linksquares.opencollection.json
    type: OpenCollection
  description: >-
    Retrieve the metadata LinkSquares Analyze extracts from agreements - Smart
    Values (100+ automatically extracted data points), Terms, Types, Tags, and
    the parent/child hierarchy - in bulk or per agreement, with Type, Tag, and
    updated-since date filters for keeping external systems in sync. Confirmed
    endpoints include GET /v1/agreements/{agreement_id}/terms, PATCH
    /v2/agreements/{agreement_id}/terms/{term_id}, GET
    /v1/agreements/{agreement_id}/hierarchy, and GET /v1/agreement_types.
- aid: linksquares:linksquares-finalize-api
  name: LinkSquares Finalize Workflow API
  tags:
  - Workflows
  - Templates
  - Tasks
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://help.linksquares.com/hc/en-us/articles/10575707057175-LinkSquares-API-Overview
  baseURL: https://api.linksquares.com/api/finalize
  properties:
  - url: https://help.linksquares.com/hc/en-us/articles/10575707057175-LinkSquares-API-Overview
    type: Documentation
  - url: openapi/linksquares-openapi.yml
    type: OpenAPI
  description: >-
    Let external systems collaborate with legal on contracts in LinkSquares
    Finalize - retrieve available Finalize templates (Draft, Intake, and Request
    forms) and their Agreement Detail Questions and tokens, create draft, intake,
    or request agreements from third-party systems, and retrieve and approve
    tasks associated with your environment. The Finalize surface is documented
    at the capability level in the LinkSquares API Overview; concrete Finalize
    endpoint paths in the OpenAPI are MODELED from that description and require
    confirmation against the customer-gated API reference.
- aid: linksquares:linksquares-scim-provisioning-api
  name: LinkSquares User and Group Provisioning (SCIM)
  tags:
  - Users
  - Groups
  - SCIM
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://help.linksquares.com/hc/en-us/articles/24831343635863-LinkSquares-Service-Integration-User-Authorization-Requirements
  baseURL: https://api.linksquares.com
  properties:
  - url: https://help.linksquares.com/hc/en-us/articles/24831343635863-LinkSquares-Service-Integration-User-Authorization-Requirements
    type: Documentation
  description: >-
    User and group lifecycle management is offered through SCIM 2.0
    provisioning on the Enterprise tier rather than a public REST endpoint.
    There is no documented public REST user-management API, base path, or
    published SCIM auth flow; the SCIM endpoint URL and supported operations are
    provided during a vendor onboarding call. This entry is an honest gated stub
    - no endpoints are modeled because none are publicly confirmable. The GET
    /api/analyze/v1/me endpoint on the Analyze API returns the identity of the
    user the API key is assigned to.
