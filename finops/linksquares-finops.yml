description: >-
  FinOps view of LinkSquares spend. LinkSquares is enterprise CLM software billed
  as a negotiated annual subscription rather than usage-metered API pricing, so
  there is no public per-call or per-token rate to model. The dominant cost is
  the platform subscription (Analyze and/or Finalize, plus capability tiers);
  API access is included for customers rather than invoiced separately as far as
  public documentation shows. This document models the billing shape honestly;
  concrete rates are not reconciled and must be confirmed with LinkSquares sales.
notes: >-
  Contract/subscription pricing is quote-based and not public. No usage meters
  (per API call, per agreement, per Smart Value) are published; the rate limit of
  15 rps is a performance guardrail, not a billing meter. Reconcile actual
  contract terms and any overage/seat structure with LinkSquares during
  procurement.
