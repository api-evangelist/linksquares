principles:
- name: Visibility
  description: Track which teams consume the LinkSquares API and their request volume against the 15 rps limit, even though calls are not separately billed.
- name: Allocation
  description: Map the LinkSquares subscription to the legal and business functions that use Analyze and Finalize.
- name: Optimization
  description: Use Type/Tag and updated-since filters and cursor pagination to sync only changed agreements, staying within the rate limit and minimizing wasted calls.
- name: Accountability
  description: Assign an owner for the LinkSquares contract and API keys; review subscription tier and seat usage at renewal.
